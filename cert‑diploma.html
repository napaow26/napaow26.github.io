<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>文凭证书生成器</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/pdfmake.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/vfs_fonts.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{max-width:1100px;margin:24px auto;padding:0 20px;}
.box{border:1px solid #ccc;padding:20px;border-radius:8px;margin-bottom:16px;}
button{padding:10px 20px;background:#0f3460;color:#fff;border:none;border-radius:6px;margin:4px;cursor:pointer;}
button:disabled{background:#999;cursor:not-allowed}
#fileInput{margin:10px 0;}
.item{padding:8px 0;border-bottom:1px solid #eee;}
.tip{font-size:13px;color:#555;}
</style>
</head>
<body>
<h1>文凭证书生成器</h1>
<div class="box">
  <h3>1. 上传Excel文件</h3>
  <input type="file" id="fileInput" accept=".xlsx,.xls">
  <p class="tip">Excel栏目：姓名, 学号, 学位, 毕业日, 毕业月, 毕业年</p>
  <p class="tip">现在只需要logo.png和seal.png。签名是自动生成的。</p>
</div>

<div class="box">
  <h3>2. 学生名单加载</h3>
  <div id="listWrap"></div>
</div>

<div class="box">
  <h3>3. 批量导出加密PDF</h3>
  <button id="batchBtn" disabled>生成并下载所有PDF</button>
  <div id="msg"></div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const listWrap = document.getElementById('listWrap');
const batchBtn = document.getElementById('batchBtn');
const msg = document.getElementById('msg');
let studentList = [];

fileInput.onchange = function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = evt=>{
    const wb = XLSX.read(evt.target.result,{type:'binary'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    studentList = XLSX.utils.sheet_to_json(sheet);
    renderList();
    batchBtn.disabled = studentList.length===0;
  }
  reader.readAsBinaryString(file);
}

function renderList(){
  listWrap.innerHTML = '';
  studentList.forEach(s=>{
    const div = document.createElement('div');
    div.className='item';
    div.textContent = `姓名:${s.姓名} |ID: ${s.学号} |学位: ${s.学位??"未定义"}`;
    listWrap.appendChild(div);
  })
}

function buildPdfDoc(stu){
  if(!stu.学位) throw new Error(`学生【${stu.姓名}】缺少【学位】字段，请检查Excel！`);
  return {
    pageSize:'A4',
    pageMargins:[50,50,50,50],
    background:[
      {type:'rect',x:20,y:20,w:555,h:792,lineWidth:1.2,lineColor:'#1a3460'}
    ],
    content:[
      {
        columns:[
          {image:'./logo.png',width:80},
          {stack:[
            {text:"Wrightu University",fontSize:28,bold:true,margin:[10,12,0,0]}
          ]}
        ],
        margin:[0,10,0,40]
      },

      {text:"The Senate of Wrightu University",fontSize:14,italics:true,alignment:'center'},
      {text:"confers upon",fontSize:14,italics:true,alignment:'center',margin:[0,4,0,20]},

      {text:stu.姓名.toUpperCase(),fontSize:18,bold:true,alignment:'center',margin:[0,0,0,24]},

      {text:"who has fulfilled all prescribed requirements",fontSize:13,italics:true,alignment:'center'},
      {text:"and passed all examinations",fontSize:13,italics:true,alignment:'center'},
      {text:"the award of",fontSize:13,italics:true,alignment:'center',margin:[0,4,0,24]},

      {text:stu.学位.toUpperCase(),fontSize:22,bold:true,alignment:'center',margin:[0,0,0,40]},

      {
        columns:[
          {text:"Dated this",fontSize:13},
          {text:stu.毕业日+"nd",fontSize:13,bold:true},
          {text:"day of",fontSize:13},
          {text:stu.毕业月,fontSize:13,bold:true},
          {text:"in the year",fontSize:13},
          {text:stu.毕业年,fontSize:13,bold:true},
        ],
        margin:[0,0,0,60]
      },

      {
        columns:[
          {
            stack:[
              {text:"JKG",fontSize:38,italic:true,color:'#111'},
              {text:"Vice Chancellor",alignment:'center',fontSize:12}
            ]
          },
          {image:'./seal.png',width:140,alignment:'center'},
          {
            stack:[
              {text:"JKG",fontSize:38,italic:true,color:'#111'},
              {text:"Registrar",alignment:'center',fontSize:12}
            ]
          }
        ]
      },
      {text:"\nWrightu University internal certificate.",fontSize:9,alignment:'center',color:'#333'}
    ],
    userPassword:String(stu.学号),
    ownerPassword:"wrightu-cert-2026",
    permissions:{printing:"none",copying:false,modifying:false}
  }
}

batchBtn.onclick = async function(){
  try{
    msg.innerText="正在生成PDF……";
    batchBtn.disabled=true;
    for(const s of studentList){
      msg.innerText=`正在处理：${s.姓名}`;
      const def = buildPdfDoc(s);
      const pdf = pdfmake.createPdf(def);
      await new Promise(resolve=>{
        pdf.download(`${s.姓名}_${s.学号}_Diploma.pdf`,resolve);
      })
    }
    msg.innerText=`✅全部完成，共${studentList.length}个PDF。打开密码=学号`;
  }catch(err){
    msg.innerText=`❌错误：${err.message}`;
    alert(err.message);
    console.error(err);
  }finally{
    batchBtn.disabled=false;
  }
}
</script>
</body>
</html>
